A Trystero 0.27.0 peer of the interop test, which run.mjs opens in headless Chrome: what the C++ peers do
(interop/peer_room.hpp), with the same parameters in the URL and the same events in window.events.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trystero JS peer</title>
<script type="importmap">
{
    "imports": {
        "trystero": "/node_modules/trystero/dist/index.mjs",
        "@trystero-p2p/core": "/node_modules/@trystero-p2p/core/dist/index.mjs",
        "@trystero-p2p/nostr": "/node_modules/@trystero-p2p/nostr/dist/index.mjs",
        "@noble/secp256k1": "/node_modules/@noble/secp256k1/index.js"
    }
}
</script>
</head>
<body>
<pre id="log"></pre>
<script type="module">
import {createUserIdentity, exportUserIdentity, importUserIdentity, joinRoom, setRelayConnectivity} from 'trystero'

window.events = []
const record = (kind, fields = {}) => window.events.push({...fields, kind})
const log = text => document.getElementById('log').append(`[${(performance.now() / 1000).toFixed(2)}s] ${text}\n`)
const params = new URLSearchParams(location.search)
const param = name => params.get(name) ?? ''

const checksum = bytes => {
    let sum = 0
    for (let i = 0; i < bytes.length; i++) sum = (sum + bytes[i] * (i + 1)) >>> 0
    return sum
}
const pattern = (size, step) => new Uint8Array(size).map((_, i) => (i * step) % 256)
const sent = (what, peer) => [() => record('sent', {what, peer, error: ''}), e => record('sent', {what, peer, error: String(e)})]

// The largest message this page sent and received on its data channels, for the wide transfer: 0.27.0 sends a
// transfer in frames of 64 KiB (maxBulkFrameBytes) to a peer whose connection can take them, else of 16 KiB. Trystero
// looks RTCPeerConnection up when it makes one, so the class it finds is this one.
window.largest = {sent: 0, received: 0}
const sizeOf = data => data?.byteLength ?? data?.size ?? data?.length ?? 0
const channelSend = RTCDataChannel.prototype.send
RTCDataChannel.prototype.send = function (data) {
    window.largest.sent = Math.max(window.largest.sent, sizeOf(data))
    return channelSend.call(this, data)
}
const watch = channel =>
    channel.addEventListener('message', ({data}) => (window.largest.received = Math.max(window.largest.received, sizeOf(data))))
const PeerConnection = window.RTCPeerConnection
window.RTCPeerConnection = class extends PeerConnection {
    constructor(...args) {
        super(...args)
        this.addEventListener('datachannel', ({channel}) => watch(channel))
    }
    createDataChannel(...args) {
        const channel = super.createDataChannel(...args)
        watch(channel)
        return channel
    }
}

// The user: an imported identity, a new one whose text the identity event carries, or, with neither, a new
// one of this page alone ('none': the pages of one origin would otherwise share the one IndexedDB keeps).
let identity = 'none'
if (param('identity')) {
    identity = await importUserIdentity(param('identity'))
} else if (param('export')) {
    identity = await createUserIdentity()
    record('identity', {text: await exportUserIdentity(identity), user: identity.userId})
}
if (param('offline')) setRelayConnectivity('offline')

const room = joinRoom({
    appId: param('app'),
    identity,
    // No ICE server: Chrome gathers its host candidates alone, and asks no public STUN server.
    rtcConfig: {iceServers: []},
    ...(param('password') ? {password: param('password')} : {}),
    ...(param('maxUsers') ? {maxUsers: Number(param('maxUsers'))} : {}),
    ...(param('relays') ? {relayConfig: {urls: param('relays').split(',')}} : {}),
}, param('room'))
room.onError(e => {
    log(`error ${e.code}: ${e.message}`)
    record('error', {code: e.code, error: e.message, peer: e.peerId ?? ''})
})

const chat = room.makeAction('chat')
const drink = room.makeAction('drink')
const file = room.makeAction('file')
const wide = room.makeAction('wide')
const question = room.makeAction('question', {kind: 'request'})
chat.onMessage((text, {peerId}) => {
    record('chat', {from: peerId, text})
    if (!text.startsWith('echo: ')) chat.send('echo: ' + text, {target: peerId})
})
drink.onMessage((value, {peerId}) => record('drink', {from: peerId, value}))
const bytesOf = kind => (data, {peerId, metadata}) => {
    const bytes = new Uint8Array(data)
    record(kind, {from: peerId, size: bytes.length, checksum: checksum(bytes), metadata: metadata === undefined ? '' : JSON.stringify(metadata)})
}
file.onMessage(bytesOf('file'))
wide.onMessage(bytesOf('wide'))
question.onRequest((text, {peerId}) => {
    record('request', {from: peerId, text})
    return 'answer to: ' + text
})
room.onPeerJoin(({peerId: peer, userId: user}) => {
    log(`peer joined: ${peer} of ${user}`)
    record('peer-join', {peer, user})
    chat.send('hello from Trystero JS', {target: peer}).then(...sent('chat', peer))
    drink.send({drink: 'negroni', withIce: true, from: 'js'}, {target: peer}).then(...sent('drink', peer))
    file.send(pattern(100_000, 7), {target: peer, metadata: {name: 'from-js.bin'}}).then(...sent('file', peer))
    if (param('wide')) wide.send(pattern(1024 * 1024, 7), {target: peer}).then(...sent('wide', peer))
    question.request('question from Trystero JS', {target: peer}).then(
        text => record('response', {peer, text, error: ''}),
        e => record('response', {peer, text: '', error: String(e)}))
    room.ping(peer).then(ms => record('ping', {peer, ms, error: ''}), e => record('ping', {peer, error: String(e)}))
})
room.onPeerLeave(({peerId: peer, userId: user}) => {
    log(`peer left: ${peer} of ${user}`)
    record('peer-leave', {peer, user})
})
room.onUserJoin(({userId: user, peerId: peer}) => record('user-join', {user, peer}))
room.onUserLeave(({userId: user, peerId: peer}) => record('user-leave', {user, peer}))

const self = await room.getSelf()
record('joined', {self: self.peerId, user: self.userId})
log(`self ${self.peerId} of ${self.userId}`)

// The driver's calls.
window.leave = () => room.leave().then(() => record('left', {error: ''}))
window.chat = (text, target) => chat.send(text, {target})
window.offline = () => record('connectivity', {mode: setRelayConnectivity('offline')})
window.online = () => record('connectivity', {mode: setRelayConnectivity('online')})
window.users = () => room.getUsers()
window.peers = () => Object.fromEntries(Object.entries(room.getPeers()).map(([id, info]) => [id, info.userId]))
</script>
</body>
</html>
