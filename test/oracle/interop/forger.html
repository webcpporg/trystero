A Trystero 0.27.0 peer of the interop test that claims a user it cannot sign for: it joins with a custom
identity (0.27.0's UserIdentity object) whose sign() signs 0.27.0's startup check with the user's key, so that
joinRoom takes it, and every later payload, the handshake's user proof among them, with another key. A peer that
verifies the proof refuses it. Same URL parameters as js.html (app, room, password, relays); its events are
joined {self, user}, signed {count} for each signature made, peer-join {peer, user} and error {code, error, peer}.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forger</title>
<script type="importmap">
{
    "imports": {
        "trystero": "/node_modules/trystero/dist/index.mjs",
        "@trystero-p2p/core": "/node_modules/@trystero-p2p/core/dist/index.mjs",
        "@trystero-p2p/nostr": "/node_modules/@trystero-p2p/nostr/dist/index.mjs",
        "@noble/secp256k1": "/node_modules/@noble/secp256k1/index.js"
    }
}
</script>
</head>
<body>
<pre id="log"></pre>
<script type="module">
import {createUserIdentity, joinRoom} from 'trystero'

window.events = []
const record = (kind, fields = {}) => window.events.push({...fields, kind})
const params = new URLSearchParams(location.search)
const param = name => params.get(name) ?? ''

const claimed = await createUserIdentity()
const other = await createUserIdentity()
let count = 0
const identity = {
    userId: claimed.userId,
    signPubJwk: claimed.signPubJwk,
    sign: payload => {
        record('signed', {count: ++count})
        return (count === 1 ? claimed : other).sign(payload)
    },
}
const room = joinRoom({
    appId: param('app'),
    identity,
    rtcConfig: {iceServers: []},
    ...(param('password') ? {password: param('password')} : {}),
    ...(param('relays') ? {relayConfig: {urls: param('relays').split(',')}} : {}),
}, param('room'))
room.onError(e => record('error', {code: e.code, error: e.message, peer: e.peerId ?? ''}))
room.onPeerJoin(({peerId: peer, userId: user}) => record('peer-join', {peer, user}))
const self = await room.getSelf()
record('joined', {self: self.peerId, user: self.userId})
window.leave = () => room.leave().then(() => record('left', {error: ''}))
</script>
</body>
</html>
