A watcher of the interop test, which run.mjs opens in headless Chrome: it holds no room key, and with `mode=garbage`
(the default) answers every offer the C++ peer (`target`) publishes with a forged answer in the name of the peer the
offer is for. With `mode=replay` it forges nothing: it records the first sealed answer and the first sealed offer each
peer sends the C++ peer, and resends them in that peer's name later, an answer with each new offer of the C++ peer to
that peer, an offer as soon as that peer announces itself or is asked to offer. With `mode=reflect` it sends the
target its own sealed texts back: each offer the target publishes to a peer comes back at once as that peer's answer;
with `decoy`, an id it announces above the target, the target's sealed offer to the decoy comes back as an offer in the
name of each other peer that announces itself. With `mode=mint` (the upstream reproduction, trystero-upstream-replay.md
in the plan's directory; no scenario uses it) it announces a fresh id above every peer every 2 s, keeps each sealed
offer a peer makes to one, and delivers it to the target in that peer's name when the target or that peer announces.
What anyone who reads the relays can do: the topics are public, a peer id proves nothing, and a sealed offer or answer
names neither its offer nor a peer.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forger</title>
<script type="importmap">
{
    "imports": {
        "trystero": "/node_modules/trystero/dist/index.mjs",
        "@trystero-p2p/core": "/node_modules/@trystero-p2p/core/dist/index.mjs",
        "@trystero-p2p/nostr": "/node_modules/@trystero-p2p/nostr/dist/index.mjs",
        "@noble/secp256k1": "/node_modules/@noble/secp256k1/index.js"
    }
}
</script>
</head>
<body>
<pre id="log"></pre>
<script type="module">
import {createEvent} from '@trystero-p2p/nostr'
import {sha1} from '@trystero-p2p/core'

window.events = []
const record = (kind, fields = {}) => window.events.push({kind, ...fields})
const params = new URLSearchParams(location.search)
const target = params.get('target')
const replay = params.get('mode') === 'replay'
const reflect = params.get('mode') === 'reflect'
const mint = params.get('mode') === 'mint'
const decoy = params.get('decoy')
// mode=reflect with a decoy: the target's sealed offer to the decoy, once it sent one.
let decoyOffer = null
// mode=mint: the topics of the fresh ids announced, and each peer's sealed offers to them, not yet delivered.
const mintTopics = new Set()
const minted = new Map()
// What each peer sent the target, sealed, recorded once: peer id -> text.
const answers = new Map()
const offers = new Map()
const root = ['Trystero', params.get('app'), params.get('room')].join('@')
const rootTopic = await sha1(root)
const targetTopic = await sha1(`${root}@${target}`)
// The peer each peer topic belongs to, learnt from the announcements on the room's topic.
const owners = new Map()
const socket = new WebSocket(params.get('relays').split(',')[0])
socket.onopen = () => {
    // Every event the relay forwards: a watcher needs no topic of its own.
    socket.send(JSON.stringify(['REQ', 'all', {}]))
    record('watching')
    const announce = async id => socket.send(await createEvent(rootTopic, JSON.stringify({peerId: id})))
    if (reflect && decoy) {
        announce(decoy)
        setInterval(() => announce(decoy), 3000)
    }
    if (mint) {
        setInterval(async () => {
            const id = ('zz' + Math.random().toString(36).slice(2) + '000000000000000000').slice(0, 20)
            mintTopics.add(await sha1(`${root}@${id}`))
            announce(id)
        }, 2000)
    }
}
socket.onmessage = async message => {
    const [type, , event] = JSON.parse(message.data)
    if (type !== 'EVENT') return
    const topic = event.tags.find(t => t[0] === 'x')?.[1]
    let content
    try {
        content = JSON.parse(event.content)
    } catch {
        return
    }
    const publish = async (signal, kind, fields) => {
        socket.send(await createEvent(targetTopic, JSON.stringify(signal)))
        record(kind, fields)
    }
    const announcement = !content.offer && !content.answer && !content.candidate
    if (reflect) {
        if (topic === rootTopic && content.peerId && content.peerId !== target) {
            owners.set(await sha1(`${root}@${content.peerId}`), content.peerId)
        }
        if (decoy && !decoyOffer && content.peerId === target && content.offer && topic === await sha1(`${root}@${decoy}`)) {
            decoyOffer = content.offer
            record('recorded', {what: 'decoy-offer'})
        } else if (!decoy && content.peerId === target && content.offer && owners.has(topic)) {
            const victim = owners.get(topic)
            await publish({peerId: victim, offerId: content.offerId, answer: content.offer}, 'reflected', {what: 'answer', victim})
        } else if (decoyOffer && topic === rootTopic && announcement && ![target, decoy].includes(content.peerId)) {
            const victim = content.peerId
            await publish({peerId: victim, offerId: genOfferId(), offer: decoyOffer}, 'reflected', {what: 'offer', victim})
        }
        return
    }
    if (mint) {
        if (mintTopics.has(topic) && content.offer && content.peerId !== target) {
            if (!minted.has(content.peerId)) minted.set(content.peerId, [])
            minted.get(content.peerId).push(content.offer)
            record('recorded', {what: 'minted-offer', peer: content.peerId})
        } else if (topic === rootTopic && announcement && content.peerId && !content.peerId.startsWith('zz')) {
            const peers = content.peerId === target ? [...minted.keys()] : [content.peerId]
            for (const victim of peers) {
                const offer = minted.get(victim)?.shift()
                if (offer) await publish({peerId: victim, offerId: genOfferId(), offer}, 'minted', {what: 'offer', victim})
            }
        }
        return
    }
    if (topic === rootTopic && content.peerId && content.peerId !== target) {
        owners.set(await sha1(`${root}@${content.peerId}`), content.peerId)
        const offer = replay && announcement && offers.get(content.peerId)
        if (offer) await publish({peerId: content.peerId, offerId: genOfferId(), offer}, 'replayed', {what: 'offer'})
    } else if (replay && topic === targetTopic && content.peerId !== target) {
        for (const [what, recorded] of [['answer', answers], ['offer', offers]]) {
            if (content[what] && !recorded.has(content.peerId)) {
                recorded.set(content.peerId, content[what])
                record('recorded', {what, peer: content.peerId})
            }
        }
    } else if (content.peerId === target && owners.has(topic)) {
        const victim = owners.get(topic)
        if (!replay && content.offer) {
            const forged = {peerId: victim, offerId: content.offerId, answer: 'not a sealed answer'}
            await publish(forged, 'forged', {victim, offerId: content.offerId})
        } else if (replay && content.offer && answers.has(victim)) {
            const replayed = {peerId: victim, offerId: content.offerId, answer: answers.get(victim)}
            await publish(replayed, 'replayed', {what: 'answer'})
        } else if (replay && announcement && offers.has(victim)) {
            await publish({peerId: victim, offerId: genOfferId(), offer: offers.get(victim)}, 'replayed', {what: 'offer'})
        }
    }
}
// A fresh offer id of Trystero's length, as a resender would make one.
const genOfferId = () => Math.random().toString(36).slice(2, 14).padEnd(12, '0')
</script>
</body>
</html>
